# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/jewellery_inventory?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=prakash
spring.datasource.password=prakash
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# JWT Configuration
jwt.secret=jewellery_inventory_system_secret_key_2026_do_not_share_in_production_environment
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.jewellery.inventory=DEBUG
logging.level.org.springframework.security=DEBUG

# Application Info
spring.application.name=Jewellery Inventory System
spring.application.version=1.0.0

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration (handled in SecurityConfig)
